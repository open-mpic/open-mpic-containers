apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: coordinator
    version: v1
  name: coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coordinator
      version: v1
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: coordinator
        version: v1
    spec:
      containers:
        - image: ghcr.io/open-mpic/coordinator:latest
          name: coordinator
          # Optional OpenTelemetry export settings:
          # env:
          #   - name: OTEL_TRACES_ENABLED
          #     value: "true"
          #   - name: OTEL_METRICS_ENABLED
          #     value: "true"
          #   - name: OTEL_LOGS_ENABLED
          #     value: "true"
          #   - name: OTEL_EXPORTER_OTLP_ENDPOINT
          #     value: "http://otel-collector.observability.svc.cluster.local:4318"
          #   - name: OTEL_SERVICE_NAME
          #     value: "mpic-coordinator"
          #   - name: OTEL_RESOURCE_ATTRIBUTES
          #     value: "deployment.environment=production"
          ports:
            - containerPort: 80
              protocol: TCP
          resources: {}
          volumeMounts:
            - name: app-conf
              mountPath: /app/config/app.conf
              subPath: app.conf
            - name: available-perspectives
              mountPath: /app/resources/available_perspectives.yaml
              subPath: available_perspectives.yaml
      restartPolicy: Always
      volumes:
        - name: app-conf
          configMap:
            name: coordinator-config
        - name: available-perspectives
          configMap:
            name: available-perspectives
