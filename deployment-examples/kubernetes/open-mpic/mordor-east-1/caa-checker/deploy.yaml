apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: caa-checker
    version: v1
  name: caa-checker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caa-checker
      version: v1
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: caa-checker
        version: v1
    spec:
      containers:
        - image: ghcr.io/open-mpic/caa_checker:latest
          name: caa-checker
          # Optional OpenTelemetry export settings:
          # env:
          #   - name: OTEL_TRACES_ENABLED
          #     value: "true"
          #   - name: OTEL_METRICS_ENABLED
          #     value: "true"
          #   - name: OTEL_LOGS_ENABLED
          #     value: "true"
          #   - name: OTEL_EXPORTER_OTLP_ENDPOINT
          #     value: "http://otel-collector.observability.svc.cluster.local:4318"
          #   - name: OTEL_SERVICE_NAME
          #     value: "mpic-caa-checker"
          #   - name: OTEL_RESOURCE_ATTRIBUTES
          #     value: "deployment.environment=production"
          ports:
            - containerPort: 80
              protocol: TCP
          resources: {}
          volumeMounts:
            - name: app-conf
              mountPath: /app/config/app.conf
              subPath: app.conf
      restartPolicy: Always
      volumes:
        - name: app-conf
          configMap:
            name: caa-config
