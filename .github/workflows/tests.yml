name: Tests

on:
  workflow_call:
  pull_request:
    branches:
      - main
    paths:
      - "api-implementation/**"
      - ".github/workflows/tests.yml"
  push:
    branches:
      - main
    paths:
      - "api-implementation/**"
      - ".github/workflows/tests.yml"

permissions:
  contents: write
  pull-requests: write

env:
  PYTHON_VERSION: "3.13"
  COVERAGE_MINIMUM: "100"

jobs:
  Tests:
    name: Unit tests and coverage gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-implementation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Hatch
        uses: pypa/hatch@install

      - name: Run unit tests with coverage gate
        id: unit_tests
        continue-on-error: true
        run: |
          set -o pipefail
          hatch env run -e test -- pytest tests/unit \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html \
            --junitxml=pytest.xml \
            --cov-fail-under=${{ env.COVERAGE_MINIMUM }} | tee pytest-coverage.txt

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: |
            api-implementation/coverage.xml
            api-implementation/htmlcov/

      - name: Coverage comment
        if: always() && github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@v1.7.2
        with:
          pytest-coverage-path: api-implementation/pytest-coverage.txt
          pytest-xml-coverage-path: api-implementation/coverage.xml
          junitxml-path: api-implementation/pytest.xml
          title: Coverage Report


      - name: Fail job if test or coverage gate failed
        if: steps.unit_tests.outcome == 'failure'
        run: |
          echo "Unit tests or coverage gate failed." >&2
          exit 1
